# Production/beta uchun to'liq stack — Oracle Cloud (yoki boshqa) VM'da
# ishlatish uchun. Ishga tushirishdan oldin OT.md'dagi qadamlarni bajaring
# va quyidagi <...> joylarni to'ldiring (yoki .env fayl orqali uzating).
#
# Ishga tushirish: docker compose -f docker-compose.prod.yml up -d --build

version: '3.8'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ilm_crm
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio
      APP_ENV: production
    depends_on:
      - postgres
      - redis
      - minio
    ports:
      - "3000:3000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
    depends_on:
      - backend
    ports:
      - "3001:3001"
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
